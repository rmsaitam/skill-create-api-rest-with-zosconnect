[project]
name = "create-api-rest-with-zosconnect-plugin"
version = "0.1.0"
description = "COBOL copybook to IBM z/OS Connect Swagger 2.0 and OpenAPI 3.0 plugin for Codex, Claude Code, Antigravity, GitHub Copilot, and Cursor."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "COBOL OpenAPI Generator contributors" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["skills/cobol-openapi-generator/scripts", "scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
